<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-app">
    <h1>My To-Do List</h1>

    <form id="todo-form">
      <input
        id="todo-input"
        type="text"
        placeholder="What needs to be done?"
        aria-label="New task"
        autocomplete="off"
      />
      <button type="submit">Add</button>
    </form>

    <p id="empty-message" class="empty-message">No tasks yet. Add one above.</p>
    <ul id="todo-list"></ul>
    <script src="script.js"></script>
   </main>
</body>
</html>
